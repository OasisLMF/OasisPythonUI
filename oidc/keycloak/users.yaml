# Keycloak User Definitions
# These users will be created in the Keycloak realm during initialization
# Matches OasisPlatform Kubernetes values.yaml: keycloak.oasisRestApi.users

users:
  - username: admin
    password: password
    admin: true

  # Uncomment to add more users:
